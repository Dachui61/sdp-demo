syntax = "proto3";
package atrust;

option go_package = "github.com/atrust/poctunnel/proto";

message Handshake {
  string client_id = 1;
  string mode = 2; // "l4"
}

enum FrameType {
  HEARTBEAT = 0;
  OPEN_STREAM = 1;
  DATA = 2;
  CLOSE_STREAM = 3;
}

message OpenStream {
  string stream_id = 1;
  string target = 2; // host:port
}

message Frame {
  FrameType type = 1;
  string stream_id = 2;
  bytes payload = 3; // for DATA: raw bytes; for OPEN_STREAM: JSON-encoded OpenStream (or protobuf on future)
}

service TunnelService {
  rpc Tunnel(stream Frame) returns (stream Frame);
}
